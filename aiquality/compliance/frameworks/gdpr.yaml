# The EU General Data Protection Regulation: the articles a test run can give evidence for.
framework: gdpr
name: GDPR
source: Regulation (EU) 2016/679
link: https://eur-lex.europa.eu/eli/reg/2016/679/oj

controls:
  - id: Art. 5(1)(f)
    title: Integrity and confidentiality
    asks: Personal data is protected against unauthorised disclosure.
    evidence: [check:no_personal_data, attack_resistance]
  - id: Art. 32
    title: Security of processing
    asks: Security fit to the risk, including regularly testing how well it works.
    evidence: [attack_resistance]
    partial: Tests the agent against attacks; the organisation's systems are outside this run.
  - id: Art. 22
    title: Automated decisions
    asks: People are not subject to decisions with legal or similar effects based only on automated processing.
    applies_when: [high]
    evidence: [human_review]
    partial: Shows hand-over and reviewed findings, not who makes the final decision in production.
  - id: Art. 35
    title: Data protection impact assessment
    asks: Processing likely to be high-risk is assessed before it starts.
    outside_the_tool: An organisation's assessment.

# Eval gate: runs the quality checks on every pull request and fails the build on a regression.
# Two jobs (the key-free / live split):
#   eval-gate : no API key, same result every run -> every pull request and push to main
#               tests, examples, the aiquality release gates (good demo must pass, regressed demo
#               must fail, post-order support must pass, AeroAssist reported), the run page and the
#               dashboard, then a smoke test that the first gate study in demos/ still runs
#   eval-live : the real language-model judge measured against people's labels -> needs a secret ->
#               run by hand (live agent runs are recorded in a notebook, where their cost is watched)
name: eval-gate

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:               # lets the live arm be run by hand from the Actions tab

jobs:
  eval-gate:                       # the cheap, deterministic arm — gates every PR
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]   # the versions pyproject.toml supports
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the aiquality platform with test tools
        run: pip install -e ".[dev]"
      - name: Test the testing tools (no API key)
        run: python -m pytest -q
      - name: Run every platform example (no API key)
        # Without GITHUB_STEP_SUMMARY, so example reports don't appear on the run page beside the real gates.
        run: for example in examples/[0-9][0-9]_*.py; do echo "== $example"; env -u GITHUB_STEP_SUMMARY python "$example"; done
      # The gates write their summaries to files; the last step puts them on the run page in one
      # place, with an overview table first.
      - name: Release gate must PASS on the good demo agent
        run: env -u GITHUB_STEP_SUMMARY aiquality gate --team examples/gate_demo/good_team
      - name: Release gate must FAIL (exit 1) on the regressed demo agent
        run: |
          set +e
          env -u GITHUB_STEP_SUMMARY aiquality gate --team examples/gate_demo/regressed_team
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then echo "expected exit 1 (quality failure), got $code"; exit 1; fi
      - name: Post-order support release gate must PASS (the second team, onboarded with config only)
        run: env -u GITHUB_STEP_SUMMARY aiquality gate --team post_order_support
      - name: AeroAssist release gate (reported, not blocking)
        # It fails on real high-priority errors (time windows above all), and the judge finds more that
        # the phrase checks pass (see docs/quality-log.md, "Where we are now"). Switch to blocking once
        # the confirmed high-priority errors are fixed and the gate passes.
        continue-on-error: true
        run: env -u GITHUB_STEP_SUMMARY aiquality gate --team aeroassist
      - name: AeroAssist evidence report (its run against the frameworks in team.yaml)
        if: always()
        run: aiquality evidence --team aeroassist
      - name: Summarise every gate on the run page
        if: always()
        run: aiquality ci-summary --output-dir aiquality-runs >> "$GITHUB_STEP_SUMMARY"
      - name: Build the dashboard (every team, run by run; kept with the reports)
        if: always()
        run: aiquality dashboard --output aiquality-runs/dashboard.html
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: aiquality-reports-py${{ matrix.python-version }}   # artifact names must be unique per run
          path: aiquality-runs/
      - name: "Smoke test: the first gate study in demos/ still runs (mock judge, no API key)"
        run: python demos/eval_harness.py

  eval-live:                       # the expensive, real-judge arm — not on every PR
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the platform with the model client
        run: pip install -e ".[live]"
      - name: Measure the judge against people's labels (held-back half)
        # Exit 1 (not qualified) isn't a failed build: the judge stays advisory in the gate. Exit 2 (it
        # couldn't be measured: no key, a missing package, a bad labels file, a judge call that failed) is.
        # Each run is one more held-back measurement; the count lives in the results file, so commit the
        # kept result, or the next run here counts as the first again. Run it when the judge has changed.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          aiquality validate-judge --team aeroassist --split holdout
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then echo "the judge couldn't be measured (exit $code)"; exit "$code"; fi
      - name: Keep the result (commit it to change the judge's status in the gate)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: judge-validation
          path: teams/aeroassist/judge_validation_results.jsonl

# Schedule the live arm nightly (optional):
#   add  `schedule: [{cron: "0 2 * * *"}]`  to the `on:` block above.

[build-system]
requires = ["setuptools>=77"]   # 77: the license is written as "MIT", the current standard
build-backend = "setuptools.build_meta"

[project]
name = "aiquality"
dynamic = ["version"]              # read from aiquality/__init__.py: the version lives in one place
description = "A self-serve quality platform for AI agents: evaluation, attack tests, a release gate and reports, driven by configuration."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"          # tested in CI on 3.11 and 3.12; 3.10 reaches end of life in October 2026
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Read golden sets from Excel files.
excel = ["openpyxl>=3.1"]
# Call a real language model (live judge, live agents).
live = ["anthropic"]
# Check exported traces against the official OpenTelemetry definitions (exporting needs nothing).
tracing = ["opentelemetry-proto"]
# Run the AeroAssist demo agent live (retrieval needs an embedding model).
aeroassist = ["anthropic", "numpy", "langchain-huggingface", "sentence-transformers"]
# Everything needed to run the tests and examples (numpy: the AeroAssist retrieval tests;
# opentelemetry-proto: the exported traces checked against the official definitions).
dev = ["pytest>=7", "openpyxl>=3.1", "numpy", "opentelemetry-proto"]

[tool.setuptools.dynamic]
version = {attr = "aiquality.__version__"}

[project.scripts]
aiquality = "aiquality.cli:main"

[tool.setuptools.packages.find]
include = ["aiquality*"]

[tool.setuptools.package-data]
aiquality = ["config/*.yaml", "judges/*.md", "compliance/frameworks/*.yaml", "compliance/report_template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["demos", "teams/aeroassist"]   # the study scripts, and AeroAssist's own agent code
